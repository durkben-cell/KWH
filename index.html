<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kWh Aerial Works | Precision Drone & Roof Inspections</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #ea580c;
            --accent-hover: #c2410c;
            --dark: #0f172a;
            --slate: #1e293b;
            --light-bg: #f8fafc;
            --text: #334155;
            --text-light: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; scroll-behavior: smooth; }
        body { background-color: #ffffff; color: var(--text); line-height: 1.6; }

        /* Top Bar & Header */
        .top-bar { background: var(--dark); color: #94a3b8; font-size: 0.85rem; padding: 8px 0; text-align: center; border-bottom: 1px solid #334155; }
        .top-bar span { color: #38bdf8; font-weight: bold; margin-left: 10px; }

        header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; padding: 15px 0; border-bottom: 3px solid var(--primary); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo-text { color: #ffffff; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; }
        .logo-text span { color: var(--primary); }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: #38bdf8; }

        .nav-phone { background: var(--accent); color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.95rem; transition: 0.2s; }
        .nav-phone:hover { background: var(--accent-hover); }

        /* Hero Section */
        .hero { background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://raw.githubusercontent.com/durkben-cell/KWH/main/waterfront-estate.jpg') center/cover no-repeat; color: white; padding: 90px 20px 80px; text-align: center; }
        .hero-badge { background: rgba(2, 132, 199, 0.2); border: 1px solid var(--primary); color: #38bdf8; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 20px; }
        .hero h1 { font-size: 3rem; font-weight: 900; line-height: 1.15; margin-bottom: 15px; text-transform: uppercase; }
        .hero p { font-size: 1.25rem; color: #cbd5e1; max-width: 700px; margin: 0 auto 35px; }

        /* Lead Capture Form Card */
        .lead-card { background: white; color: var(--text); border-radius: 12px; padding: 30px; max-width: 500px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); text-align: left; }
        .lead-card h3 { color: var(--dark); font-size: 1.3rem; margin-bottom: 5px; text-align: center; }
        .lead-card p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--dark); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        .form-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 6px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .form-btn:hover { background: var(--accent-hover); }

        /* Success Message State */
        .form-success-message {
            display: none;
            text-align: center;
            padding: 2rem 1rem;
        }
        .form-success-message h3 { color: var(--dark); font-size: 1.4rem; margin-bottom: 8px; }
        .form-success-message p { color: var(--text-light); font-size: 0.9rem; }
        .success-icon {
            width: 48px;
            height: 48px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 2px solid #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 12px auto;
        }

        /* Trust Stats Section */
        .stats { background: var(--slate); color: white; padding: 40px 20px; text-align: center; border-bottom: 1px solid #334155; }
